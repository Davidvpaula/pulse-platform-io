name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build + Tests + Smoke Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Vitest
        run: bunx vitest run

      - name: Smoke tests (strict — drift guard)
        run: node scripts/smoke-tests.mjs --strict

  e2e:
    name: Playwright E2E (Onda A)
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 20
    # Onda A roda contra a URL de preview Lovable.
    # Se o preview estiver offline, o job falha — é o comportamento esperado.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://pulse-platform-io.lovable.app' }}
          CI: "1"
        run: bunx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
